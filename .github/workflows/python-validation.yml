name: Python validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**/*.py"
      - ".gitattributes"
      - "data/*.json"
      - "results_*/**"
      - "requirements.txt"
      - ".github/workflows/python-validation.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.py"
      - ".gitattributes"
      - "data/*.json"
      - "results_*/**"
      - "requirements.txt"
      - ".github/workflows/python-validation.yml"

permissions:
  contents: read

concurrency:
  group: python-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run benchmark tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Audit published result bundles
        run: |
          python result_bundle_audit.py results_revision/experiment_manifest.json
          python result_bundle_audit.py results_revision2/experiment_manifest.json
