<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="arbitrage-fsm-title arbitrage-fsm-desc">
<title id="arbitrage-fsm-title">BATTERY DISPATCH — Finite-state teaching abstraction</title>
<desc id="arbitrage-fsm-desc">A three-state charge, idle, and discharge finite-state abstraction, with charge and discharge transition guards at maximum and minimum SOC. It is not a forecast, optimizer, or full reinforcement-learning policy. Decorative dash motion is not runtime telemetry and stops when reduced motion is requested.</desc>
<defs>
  <linearGradient id="arbitrage-fsm-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="var(--bg-top)"/><stop offset="1" stop-color="var(--bg)"/></linearGradient>
  <pattern id="arbitrage-fsm-dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="var(--grid)" opacity=".28"/></pattern>
  <marker id="arbitrage-fsm-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B"/></marker>
  <style>
    :root { color-scheme: dark light; --bg:#07111F; --bg-top:#0D2235; --surface:#102237; --surface-2:#142B42; --ink:#E8F2FB; --muted:#A6BAD0; --grid:#5F7891; --outline:#36516A; --shadow:#020711; --accent:#F59E0B; }
    @media (prefers-color-scheme: light) { :root { --bg:#F5F9FC; --bg-top:#EAF3F9; --surface:#FFFFFF; --surface-2:#F1F7FA; --ink:#102237; --muted:#40566C; --grid:#AFC2D1; --outline:#9AB0C2; --shadow:#426078; --accent:#451A03; } }
    text { font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:var(--ink); }
    .eyebrow { font-size:12px; font-weight:750; letter-spacing:2px; fill:var(--accent); }
    .title { font-size:26px; font-weight:650; letter-spacing:-.35px; }
    .micro { font-size:12px; fill:var(--muted); }
    .label { font-size:15px; font-weight:620; }
    .small-label { font-size:13px; font-weight:620; }
    .stage-top { fill:var(--surface-2); stroke:var(--outline); stroke-width:1.4; }
    .stage-front { fill:var(--surface); stroke:var(--outline); stroke-width:1.2; }
    .edge { stroke:var(--outline); stroke-width:1.3; fill:none; }
    .wire { fill:none; stroke:var(--ink); stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
    .thin-wire { fill:none; stroke:var(--muted); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .flow { stroke-dasharray:10 9; animation:arbitrage-fsm-flow 1.8s linear infinite; }
    @keyframes arbitrage-fsm-flow { to { stroke-dashoffset:-38; } }
    .box-shadow { fill:var(--shadow); opacity:.38; }
    .panel { fill:var(--surface); stroke:var(--outline); stroke-width:1.35; }
    .capsule { fill:var(--surface-2); stroke:var(--outline); stroke-width:1.1; }
    .physics { stroke:#00E5FF; } .estimation { stroke:#10B981; } .power { stroke:#F59E0B; } .qa { stroke:#8B5CF6; } .limits { stroke:#F43F5E; }
    .fill-physics { fill:#083344; stroke:#00E5FF; } .fill-estimation { fill:#064E3B; stroke:#10B981; } .fill-power { fill:#451A03; stroke:#F59E0B; } .fill-qa { fill:#2E1065; stroke:#8B5CF6; } .fill-limits { fill:#4C0519; stroke:#F43F5E; }
    .component { stroke-width:1.7; stroke-linejoin:round; }
    .on-color { fill:#F8FBFF !important; }
    .note { fill:var(--surface); stroke:#F43F5E; stroke-width:1.15; }
    .note-text { font-size:13px; font-weight:560; }
    @media (prefers-reduced-motion: reduce) { .flow { animation:none !important; stroke-dashoffset:0; } }
  </style>
</defs>
<rect width="960" height="560" rx="24" fill="url(#arbitrage-fsm-bg)"/>
<rect width="960" height="560" rx="24" fill="url(#arbitrage-fsm-dots)" opacity=".42"/>
<text class="eyebrow" x="40" y="39">BATTERY DISPATCH</text>
<text class="title" x="40" y="77">Finite-state teaching abstraction</text>
<text class="micro" x="920" y="42" text-anchor="end" letter-spacing="1.5">2.5D / CONCEPTUAL</text>
<g aria-hidden="true">
  <polygon class="box-shadow" points="480,139 882,278 480,417 78,278" transform="translate(0 18)"/>
  <polygon class="stage-front" points="78,278 480,417 480,443 78,304"/>
  <polygon class="stage-front" points="882,278 480,417 480,443 882,304"/>
  <polygon class="stage-top" points="480,139 882,278 480,417 78,278"/>
  <path d="M160 278 480 168 800 278 480 388Z" fill="none" stroke="var(--grid)" stroke-width=".9" opacity=".26"/>
  <path d="M240 278 480 195 720 278 480 361Z" fill="none" stroke="var(--grid)" stroke-width=".9" opacity=".22"/>
</g>

<!-- discrete operating states -->
<rect x="104" y="238" width="196" height="94" rx="22" class="fill-physics component"/>
<text class="label on-color" x="202" y="276" text-anchor="middle">CHARGE</text><text class="micro on-color" x="202" y="301" text-anchor="middle">energy into store</text>
<rect x="382" y="238" width="196" height="94" rx="22" class="fill-qa component"/>
<text class="label on-color" x="480" y="276" text-anchor="middle">IDLE</text><text class="micro on-color" x="480" y="301" text-anchor="middle">hold operating mode</text>
<rect x="660" y="238" width="196" height="94" rx="22" class="fill-power component"/>
<text class="label on-color" x="758" y="276" text-anchor="middle">DISCHARGE</text><text class="micro on-color" x="758" y="301" text-anchor="middle">energy from store</text>
<!-- guarded transitions -->
<path d="M300 264h82" fill="none" stroke="#8B5CF6" stroke-width="2.6" marker-end="url(#arbitrage-fsm-arrow)" class="flow"/>
<text class="micro" x="341" y="249" text-anchor="middle">charge blocked at SOCmax</text>
<path d="M382 306h-82" fill="none" stroke="#00E5FF" stroke-width="2.6" marker-end="url(#arbitrage-fsm-arrow)" class="flow"/>
<text class="micro" x="341" y="352" text-anchor="middle">eligible charge action</text>
<path d="M578 264h82" fill="none" stroke="#8B5CF6" stroke-width="2.6" marker-end="url(#arbitrage-fsm-arrow)" class="flow"/>
<text class="micro" x="619" y="249" text-anchor="middle">discharge blocked at SOCmin</text>
<path d="M660 306h-82" fill="none" stroke="#F59E0B" stroke-width="2.6" marker-end="url(#arbitrage-fsm-arrow)" class="flow"/>
<text class="micro" x="619" y="352" text-anchor="middle">eligible discharge action</text>
<!-- bounded state of charge -->
<rect x="188" y="389" width="584" height="54" rx="14" class="capsule"/>
<text class="small-label" x="480" y="411" text-anchor="middle">SOC is bounded by operating constraints</text>
<rect x="239" y="421" width="482" height="8" rx="4" fill="var(--outline)"/>
<rect x="239" y="421" width="288" height="8" rx="4" fill="#10B981"/>
<circle cx="239" cy="425" r="7" fill="#F43F5E"/><circle cx="721" cy="425" r="7" fill="#F43F5E"/>
<text class="micro" x="239" y="459" text-anchor="middle">SOCmin</text><text class="micro" x="721" y="459" text-anchor="middle">SOCmax</text>
<text class="micro" x="480" y="459" text-anchor="middle">illustrative state marker only</text>
<rect class="note" x="40" y="478" width="880" height="54" rx="12"/>
<circle cx="62" cy="505" r="7" fill="#F43F5E"/>
<text class="note-text" x="80" y="501">SCOPE</text><text class="micro" x="80" y="519">A finite-state teaching abstraction only. Transition guards show SOC bounds; no market forecast, price rule, efficiency, leakage, or optimizer behavior is encoded.</text>
</svg>
